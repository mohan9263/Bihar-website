<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kanya Utthan Yojana Application</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
Mukhyamantri Kanya Utthan Yojana Application Form
</h1>

</header>



<div class="application-box">


<h2>Fill Your Details</h2>



<form>



<label>Student Name</label>

<input type="text" placeholder="Enter Student Name">



<label>Father Name</label>

<input type="text" placeholder="Enter Father Name">



<label>Mother Name</label>

<input type="text" placeholder="Enter Mother Name">



<label>Date of Birth</label>

<input type="date">



<label>Mobile Number</label>

<input type="number" placeholder="Enter Mobile Number">



<label>Email</label>

<input type="email" placeholder="Enter Email">



<label>Aadhaar Number</label>

<input type="number" placeholder="Enter Aadhaar Number">



<label>Address</label>

<textarea placeholder="Enter Full Address"></textarea>




<h2>Education Details</h2>



<label>Select Class / Course</label>


<select>


<option>10th</option>

<option>12th</option>

<option>Graduation</option>

<option>Other</option>


</select>




<h2>Upload Documents</h2>



<label>Upload Aadhaar Card</label>

<input type="file">



<label>Upload Residence Certificate</label>

<input type="file">



<label>Upload Marksheet</label>

<input type="file">



<label>Upload Bank Passbook</label>

<input type="file">



<label>Upload Passport Size Photo</label>

<input type="file">




<button type="submit">

Submit Application

</button>



</form>


</div>



<footer>

<p>
© Bihar Government Scheme Portal
</p>

</footer>



</body>

</html>
