<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bihar Startup Policy Application</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<h1>
Bihar Startup Policy Application Form
</h1>

</header>



<div class="application-box">


<h2>Startup Details</h2>



<form>



<label>Founder Name</label>

<input type="text" placeholder="Enter Founder Name">



<label>Startup Name</label>

<input type="text" placeholder="Enter Startup Name">



<label>Mobile Number</label>

<input type="number" placeholder="Enter Mobile Number">



<label>Email Address</label>

<input type="email" placeholder="Enter Email Address">



<label>Aadhaar Number</label>

<input type="number" placeholder="Enter Aadhaar Number">



<label>PAN Number</label>

<input type="text" placeholder="Enter PAN Number">



<label>Startup Address</label>

<textarea placeholder="Enter Startup Address"></textarea>





<h2>Business Details</h2>



<label>Startup Category</label>


<select>


<option>
Technology
</option>


<option>
Education
</option>


<option>
Healthcare
</option>


<option>
Agriculture
</option>


<option>
Other
</option>


</select>





<label>Business Idea / Description</label>


<textarea placeholder="Describe your startup idea"></textarea>





<label>Startup Registration Status</label>


<select>


<option>
Registered Startup
</option>


<option>
Not Registered
</option>


</select>







<h2>Upload Documents</h2>



<label>Upload Aadhaar Card</label>

<input type="file">



<label>Upload PAN Card</label>

<input type="file">



<label>Upload Startup Registration Certificate</label>

<input type="file">



<label>Upload Business Plan / Project Report</label>

<input type="file">



<label>Upload Bank Details</label>

<input type="file">



<label>Upload Founder Photo</label>

<input type="file">





<button type="submit">

Submit Application

</button>



</form>


</div>





<footer>


<p>
© Bihar Startup Portal
</p>


</footer>




</body>

</html>
